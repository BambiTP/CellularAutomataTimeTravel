<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elementary Cellular Automaton</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0f131a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .panel {
            position: absolute;
            background: rgba(20, 25, 32, 0.95);
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid #2a3241;
            backdrop-filter: blur(4px);
            max-width: 230px;
        }

        #panel-controls { top: 12px; left: 12px; }
        #panel-sequence { top: 12px; right: 12px; max-height: 60vh; overflow-y: auto; }
        #panel-info { bottom: 12px; left: 12px; }
        #panel-hint { bottom: 12px; right: 12px; }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        label {
            font-weight: bold;
            font-size: 12px;
            min-width: 30px;
        }

        input[type="number"], select {
            padding: 3px;
            border: 1px solid #3c465a;
            background: #181d26;
            color: #fff;
            border-radius: 5px;
            font-size: 12px;
            outline: none;
        }

        input[type="number"] {
            width: 48px;
            text-align: center;
            font-size: 13px;
        }

        input[type="number"]:focus, select:focus {
            border-color: #55c2da;
        }

        button {
            background: #232b38;
            color: #fff;
            border: 1px solid #3c465a;
            padding: 4px 7px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover:not(:disabled) {
            background: #2e394a;
            border-color: #55c2da;
        }

        button.active {
            background: #55c2da;
            color: #000;
            border-color: #55c2da;
            font-weight: bold;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #rule-visualizer {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            background: #11151c;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #2a3241;
            justify-content: center;
        }

        .rule-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
        }

        .rule-row {
            display: flex;
            gap: 1px;
        }

        .v-cell {
            width: 9px;
            height: 9px;
            box-sizing: border-box;
            border: 1px solid #444;
            background-color: transparent;
        }

        .v-cell.active {
            background-color: #55c2da;
            border-color: #55c2da;
        }

        .hint {
            font-size: 10px;
            color: #888;
            line-height: 1.4;
            margin-top: 6px;
        }

        #panel-hint summary {
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            outline: none;
            user-select: none;
        }

        #rule-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .legend-chip {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            background: #181d26;
            border: 1px solid #2a3241;
            border-radius: 8px;
            padding: 1px 6px 1px 4px;
        }

        .legend-swatch {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        #rule-sequence-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .seq-item {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 4px;
            font-size: 12px;
            background: #181d26;
            border: 1px solid #2a3241;
            border-radius: 6px;
            padding: 4px 6px;
            user-select: none;
            transition: opacity 0.15s ease, border-color 0.15s ease;
        }

        .seq-item.dragging {
            opacity: 0.4;
        }

        .seq-item.drag-over {
            border-color: #55c2da;
        }

        .seq-drag-handle {
            cursor: grab;
            color: #666;
            flex-shrink: 0;
        }

        .seq-swatch {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .seq-item label {
            font-weight: normal;
            font-size: 11px;
            color: #999;
            min-width: 0;
        }

        .seq-item input[type="number"] {
            width: 36px;
            padding: 2px;
            font-size: 12px;
        }

        .seq-item button {
            padding: 1px 6px;
            font-size: 11px;
            margin-left: auto;
        }

        .seq-item .seq-label {
            font-size: 11px;
            color: #999;
        }

        .seq-item-live {
            border-style: dashed;
            border-color: #3c465a;
        }

        input[type="checkbox"] {
            width: 13px;
            height: 13px;
            accent-color: #55c2da;
            cursor: pointer;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: normal;
            min-width: 0;
            cursor: pointer;
        }

        #row-rule-popup {
            position: fixed;
            z-index: 100;
            background: rgba(20, 25, 32, 0.98);
            border: 1px solid #55c2da;
            border-radius: 7px;
            padding: 6px 8px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        #row-rule-popup label {
            font-size: 10px;
            color: #aaa;
            min-width: 0;
        }

        #row-rule-popup input {
            width: 50px;
        }

        canvas {
            display: block;
        }

        canvas.tool-pan { cursor: grab; }
        canvas.tool-draw { cursor: crosshair; }
        canvas.panning { cursor: grabbing !important; }
    </style>
</head>
<body>

    <div id="panel-controls" class="panel">
        <div class="control-group">
            <label for="ruleInput">Rule:</label>
            <input type="number" id="ruleInput" min="0" max="255" value="30">
            <button id="btnBack" title="Step Backward">⏮</button>
            <button id="btnPlay" title="Play / Pause">▶ Play</button>
            <button id="btnStep" title="Step Forward">⏭</button>
            <button id="btnReset" title="Reset Grid">🔄 Reset</button>
            <button id="btnCenter" title="Fit whole grid on screen">🔍 Fit</button>
        </div>

        <div class="control-group">
            <label for="toolSelect">Tool:</label>
            <select id="toolSelect">
                <option value="pan">🖐 Pan & Zoom</option>
                <option value="affect">✏️ Draw (Clash Timeline)</option>
                <option value="overlay">🖍️ Draw (Overlay Only)</option>
            </select>
            <button id="btnClearOverlay" style="display:none;" title="Clear Overlay">🧹 Clear</button>
        </div>
    </div>

    <div id="panel-sequence" class="panel">
        <div class="control-group">
            <label style="min-width:0;">Add rule</label>
            <input type="number" id="seqRuleInput" min="0" max="255" value="90" style="width:42px;">
            <label style="min-width:0;">for</label>
            <input type="number" id="seqLengthInput" min="1" max="2000" value="10" style="width:42px;">
            <label style="min-width:0;">rows</label>
            <button id="btnAddBand" title="Appends this rule below whatever's already in the sequence">+ Add</button>
        </div>

        <div id="rule-sequence-list"></div>
    </div>

    <div id="panel-info" class="panel">
        <div id="rule-visualizer"></div>
        <div id="rule-legend"></div>
    </div>

    <div id="panel-hint" class="panel">
        <details>
            <summary>Tips</summary>
            <div class="hint">
                • <b>Right-Click</b> & drag to Pan anywhere<br>
                • <b>Right-Click</b> (no drag) a row to give it its own rule -- each rule gets its own color<br>
                • Draw <b>above or below</b> to seed a new timeline<br>
                • Editing a row instantly resimulates everything below it -- that's the clash<br>
                • Hold <b>Shift + Click</b> to Erase pixels
            </div>
        </details>
    </div>

    <canvas id="ca-canvas" class="tool-pan"></canvas>

    <script>
        const canvas = document.getElementById('ca-canvas');
        const ctx = canvas.getContext('2d');

        // Simulation State
        const GRID_WIDTH = 301; 
        let rule = 30;
        
        // Use a Map to support negative Y coordinates (above starting point) and positive Y coordinates
        let historyMap = new Map();
        // The contiguous, always-consistent range of history we've computed.
        // Every row in (minY, maxY] is guaranteed to be the true CA result of the row above it,
        // EXCEPT immediately after a manual edit, which is resolved synchronously (see cascadeFrom).
        let minY = 0;
        let maxY = 0;

        // Per-row rule overrides: sparse map of Y -> rule, set only where a user
        // right-clicked a row to change it. activeRuleMap is the dense counterpart --
        // every row that exists in historyMap also has an entry here, either its own
        // override or the rule it inherited from the row above (see activeRuleAt).
        let ruleOverrides = new Map();
        let activeRuleMap = new Map();

        let isPlaying = false;
        let playInterval;

        // Drawing State
        let overlayPixels = new Set(); 

        // Viewport State
        let cellSize = 15; 
        let offsetX = 0;
        let offsetY = 0;
        let scale = 1;

        // UI Elements
        const ruleInput = document.getElementById('ruleInput');
        const btnPlay = document.getElementById('btnPlay');
        const btnStep = document.getElementById('btnStep');
        const btnBack = document.getElementById('btnBack');
        const btnReset = document.getElementById('btnReset');
        const btnCenter = document.getElementById('btnCenter');
        const ruleVisualizer = document.getElementById('rule-visualizer');
        const ruleLegend = document.getElementById('rule-legend');
        const toolSelect = document.getElementById('toolSelect');
        const btnClearOverlay = document.getElementById('btnClearOverlay');
        const seqRuleInput = document.getElementById('seqRuleInput');
        const seqLengthInput = document.getElementById('seqLengthInput');
        const btnAddBand = document.getElementById('btnAddBand');
        const ruleSequenceList = document.getElementById('rule-sequence-list');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            draw();
        }
        window.addEventListener('resize', resizeCanvas);

        function updateRuleVisualizer() {
            ruleVisualizer.innerHTML = '';
            const ruleBinary = rule.toString(2).padStart(8, '0');

            for (let i = 7; i >= 0; i--) {
                const block = document.createElement('div');
                block.className = 'rule-block';

                const topRow = document.createElement('div');
                topRow.className = 'rule-row';

                for (let j = 2; j >= 0; j--) {
                    const cell = document.createElement('div');
                    cell.className = 'v-cell';
                    if ((i & (1 << j)) !== 0) cell.classList.add('active');
                    topRow.appendChild(cell);
                }

                const bottomRow = document.createElement('div');
                bottomRow.className = 'rule-row';
                const resultCell = document.createElement('div');
                resultCell.className = 'v-cell';

                const bitIndex = 7 - i;
                if (ruleBinary[bitIndex] === '1') resultCell.classList.add('active');
                
                bottomRow.appendChild(resultCell);
                block.appendChild(topRow);
                block.appendChild(bottomRow);
                ruleVisualizer.appendChild(block);
            }
        }

        // Reset only clears the simulated grid (cell drawings/history) -- it deliberately
        // leaves ruleOverrides/bandSequence alone and re-lays them onto the fresh grid,
        // so resetting the drawing doesn't throw away the rule setup you built.
        function init() {
            historyMap.clear();
            activeRuleMap.clear();

            let firstRow = new Uint8Array(GRID_WIDTH);
            firstRow[Math.floor(GRID_WIDTH / 2)] = 1;

            minY = 0;
            maxY = 0;
            historyMap.set(0, firstRow);
            activeRuleMap.set(0, rule);

            offsetX = canvas.width / 2 - (GRID_WIDTH * cellSize) / 2;
            offsetY = 250; // Give vertical space to look both above and below Y=0
            scale = 1;

            updateBackButton();
            updateRuleVisualizer();
            applyBandSequence(); // re-applies the existing sequence (or no-ops if empty)
        }

        // Pure CA transition: one row -> the next row, given the current rule.
        // Left/right edges wrap toroidally.
        function computeNextRow(currentRow, ruleBinary) {
            const nextRow = new Uint8Array(GRID_WIDTH);
            for (let i = 0; i < GRID_WIDTH; i++) {
                const left = currentRow[(i - 1 + GRID_WIDTH) % GRID_WIDTH];
                const center = currentRow[i];
                const right = currentRow[(i + 1) % GRID_WIDTH];

                const neighborhood = (left << 2) | (center << 1) | right;
                const bitIndex = 7 - neighborhood;
                nextRow[i] = ruleBinary[bitIndex] === '1' ? 1 : 0;
            }
            return nextRow;
        }

        // The rule in effect at row y: its own override if it has one, else whatever
        // was flowing in from the row above (fallback).
        function activeRuleAt(y, fallback) {
            return ruleOverrides.has(y) ? ruleOverrides.get(y) : fallback;
        }

        function ruleColor(r) {
            const hue = (r * 137.508) % 360; // golden angle -> well-spread hues across 0-255
            return `hsl(${hue.toFixed(1)}, 70%, 60%)`;
        }

        function updateRuleLegend() {
            const seen = new Map(); // rule -> count, in first-seen order
            for (const r of activeRuleMap.values()) {
                seen.set(r, (seen.get(r) || 0) + 1);
            }
            ruleLegend.innerHTML = '';
            for (const [r] of [...seen.entries()].sort((a, b) => a[0] - b[0])) {
                const chip = document.createElement('div');
                chip.className = 'legend-chip';
                chip.innerHTML = `<span class="legend-swatch" style="background:${ruleColor(r)}"></span>Rule ${r}`;
                ruleLegend.appendChild(chip);
            }
        }

        function updateBackButton() {
            const ok = maxY > minY;
            btnBack.disabled = !ok;
            btnBack.title = ok ? "Step Backward" : "No earlier row to step back to";
        }

        function stepForward() {
            const currentRow = historyMap.get(maxY);
            const currentRule = activeRuleMap.get(maxY) ?? rule;
            const ruleBinary = currentRule.toString(2).padStart(8, '0');
            const nextRow = computeNextRow(currentRow, ruleBinary);

            maxY += 1;
            historyMap.set(maxY, nextRow);
            activeRuleMap.set(maxY, activeRuleAt(maxY, currentRule));

            updateBackButton();
            refreshLiveRow();
            draw();
        }

        function stepBackward() {
            if (maxY <= minY) return;
            historyMap.delete(maxY);
            activeRuleMap.delete(maxY);
            maxY -= 1;
            updateBackButton();
            refreshLiveRow();
            draw();
        }

        // This is the "timeline" mechanic: editing row `editedY` (a cell, or its rule)
        // makes it a new seed. Everything below it (down to the current bottom of
        // history) is truly, synchronously recomputed from that seed -- not just
        // visually, but a full recalculation -- so the grid is always internally
        // consistent: no row is ever stale relative to the row above it. Any deeper
        // row that already had its own rule override keeps governing from there down;
        // only its cell contents get refreshed by the new data flowing into it.
        // If the edit is above/below the known range, the range is extended (with
        // blank rows filling any gap) so the cascade always has unbroken ground to
        // walk down.
        function cascadeFrom(editedY) {
            if (editedY < minY) {
                for (let y = editedY + 1; y < minY; y++) {
                    if (!historyMap.has(y)) historyMap.set(y, new Uint8Array(GRID_WIDTH));
                }
                minY = editedY;
            }
            if (editedY > maxY) {
                let inherited = activeRuleMap.get(maxY) ?? rule;
                for (let y = maxY + 1; y < editedY; y++) {
                    if (!historyMap.has(y)) historyMap.set(y, new Uint8Array(GRID_WIDTH));
                    inherited = activeRuleAt(y, inherited);
                    activeRuleMap.set(y, inherited);
                }
                maxY = editedY;
                activeRuleMap.set(editedY, activeRuleAt(editedY, inherited));
                updateBackButton();
                return; // nothing below the new bottom row to recompute
            }

            let currentRow = historyMap.get(editedY);
            let currentRule = activeRuleAt(editedY, activeRuleMap.get(editedY) ?? rule);
            activeRuleMap.set(editedY, currentRule);

            for (let y = editedY + 1; y <= maxY; y++) {
                const ruleBinary = currentRule.toString(2).padStart(8, '0');
                currentRow = computeNextRow(currentRow, ruleBinary);
                historyMap.set(y, currentRow);
                currentRule = activeRuleAt(y, currentRule);
                activeRuleMap.set(y, currentRule);
            }
            updateBackButton();
            updateRuleLegend();
        }

        function draw() {
            ctx.fillStyle = '#0f131a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);

            // Only walk the rows actually visible on screen -- historyMap can grow to
            // thousands of rows during long play sessions, so this keeps draw() cheap.
            const viewTop = Math.floor(-offsetY / (cellSize * scale)) - 1;
            const viewBottom = Math.ceil((canvas.height - offsetY) / (cellSize * scale)) + 1;
            const rowFrom = Math.max(minY, viewTop);
            const rowTo = Math.min(maxY, viewBottom);

            for (let y = rowFrom; y <= rowTo; y++) {
                const row = historyMap.get(y);
                if (!row) continue;
                ctx.fillStyle = ruleColor(activeRuleMap.get(y) ?? rule);
                for (let x = 0; x < GRID_WIDTH; x++) {
                    if (row[x] === 1) {
                        ctx.fillRect(x * cellSize, y * cellSize, cellSize - 1, cellSize - 1);
                    }
                }
            }

            // Draw Overlay Pixels (Yellow)
            ctx.fillStyle = '#ffd700';
            for (const key of overlayPixels) {
                const [x, y] = key.split(',').map(Number);
                ctx.fillRect(x * cellSize, y * cellSize, cellSize - 1, cellSize - 1);
            }

            ctx.restore();
        }

        // --- Event Listeners UI ---

        // Sets the rule for the live, still-growing bottom edge of the grid (row maxY),
        // so the very next Play/Step actually uses it -- and makes it stick through any
        // later cascade by registering it as a real override, not just a display value.
        function setLiveRule(val) {
            rule = val;
            ruleOverrides.set(maxY, val);
            activeRuleMap.set(maxY, val);
            updateRuleVisualizer();
            renderBandSequence();
        }

        ruleInput.addEventListener('change', (e) => {
            let val = parseInt(e.target.value);
            if (val < 0) val = 0;
            if (val > 255) val = 255;
            ruleInput.value = val;
            setLiveRule(val);
        });

        toolSelect.addEventListener('change', (e) => {
            canvas.className = e.target.value === 'pan' ? 'tool-pan' : 'tool-draw';
            btnClearOverlay.style.display = e.target.value === 'overlay' ? 'flex' : 'none';
        });

        // An ordered list of {rule, length} entries, stacked from row 0 downward:
        // the first entry governs rows [0, length), the next picks up right where
        // it left off, and so on. sequenceOverrideYs tracks exactly which rows the
        // sequence itself owns, so re-applying (after an add/remove) always starts
        // by clearing its own old marks rather than guessing what to undo.
        let bandSequence = [];
        let sequenceOverrideYs = [];
        let draggedBandIndex = null;

        function renderBandSequence() {
            ruleSequenceList.innerHTML = '';
            bandSequence.forEach((band, i) => {
                const item = document.createElement('div');
                item.className = 'seq-item';
                item.draggable = true;
                item.innerHTML = `
                    <span class="seq-drag-handle" title="Drag to reorder">⠿</span>
                    <span class="seq-swatch" style="background:${ruleColor(band.rule)}"></span>
                    <label style="min-width:0;">Rule</label>
                    <input type="number" class="seq-rule-input" min="0" max="255" value="${band.rule}">
                    <label style="min-width:0;">for</label>
                    <input type="number" class="seq-length-input" min="1" max="2000" value="${band.length}">
                    <label style="min-width:0;">rows</label>
                    <button title="Remove">✕</button>
                `;
                item.querySelector('button').addEventListener('click', () => {
                    bandSequence.splice(i, 1);
                    applyBandSequence();
                });

                const ruleField = item.querySelector('.seq-rule-input');
                const lengthField = item.querySelector('.seq-length-input');
                ruleField.addEventListener('change', () => {
                    let v = parseInt(ruleField.value);
                    if (isNaN(v)) v = 0;
                    band.rule = Math.max(0, Math.min(255, v));
                    applyBandSequence();
                });
                lengthField.addEventListener('change', () => {
                    let v = parseInt(lengthField.value);
                    if (isNaN(v) || v < 1) v = 1;
                    band.length = v;
                    applyBandSequence();
                });
                // Don't let selecting/editing text in these fields start a row drag.
                ruleField.addEventListener('mousedown', (e) => e.stopPropagation());
                lengthField.addEventListener('mousedown', (e) => e.stopPropagation());

                item.addEventListener('dragstart', (e) => {
                    if (e.target.tagName === 'INPUT') { e.preventDefault(); return; }
                    draggedBandIndex = i;
                    item.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                });
                item.addEventListener('dragend', () => {
                    item.classList.remove('dragging');
                    draggedBandIndex = null;
                });
                item.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    item.classList.add('drag-over');
                });
                item.addEventListener('dragleave', () => {
                    item.classList.remove('drag-over');
                });
                item.addEventListener('drop', (e) => {
                    e.preventDefault();
                    item.classList.remove('drag-over');
                    if (draggedBandIndex === null || draggedBandIndex === i) return;
                    const [moved] = bandSequence.splice(draggedBandIndex, 1);
                    bandSequence.splice(i, 0, moved);
                    draggedBandIndex = null;
                    applyBandSequence();
                });

                ruleSequenceList.appendChild(item);
            });

            appendLiveRow();
        }

        // How many rows exist beyond the fixed sequence, and under what rule. Zero
        // when the fixed sequence already reaches the bottom of history (e.g. right
        // after applying it, before any extra stepping) -- there's nothing "live" yet
        // distinct from the last fixed band, so callers should skip showing a row.
        function getLiveRegion() {
            const fixedRows = bandSequence.reduce((sum, b) => sum + b.length, 0);
            return {
                rule: activeRuleMap.get(maxY) ?? rule,
                length: Math.max(0, maxY - fixedRows + 1),
            };
        }

        // The rule currently governing the live, still-growing bottom edge of the
        // grid -- not a fixed band you added, just a view onto what Play will use
        // next and how many rows have run under it so far.
        function appendLiveRow() {
            const live = getLiveRegion();
            if (live.length <= 0) return; // nothing live yet beyond the fixed sequence

            const liveItem = document.createElement('div');
            liveItem.className = 'seq-item seq-item-live';
            liveItem.innerHTML = `
                <span class="seq-swatch" style="background:${ruleColor(live.rule)}"></span>
                <label style="min-width:0;">Rule</label>
                <input type="number" class="seq-rule-input" min="0" max="255" value="${live.rule}">
                <span class="seq-label">${live.length} row${live.length === 1 ? '' : 's'}, playing</span>
            `;
            const liveRuleField = liveItem.querySelector('.seq-rule-input');
            liveRuleField.addEventListener('change', () => {
                let v = parseInt(liveRuleField.value);
                if (isNaN(v)) v = 0;
                v = Math.max(0, Math.min(255, v));
                ruleInput.value = v;
                setLiveRule(v);
            });
            ruleSequenceList.appendChild(liveItem);
        }

        // Cheap update called on every Play/Step tick -- keeps the live row's row
        // count accurate while playing, without rebuilding (and losing focus/state
        // in) the rest of the list on every single step.
        function refreshLiveRow() {
            const live = getLiveRegion();
            const existing = ruleSequenceList.querySelector('.seq-item-live');

            if (live.length <= 0) {
                if (existing) existing.remove();
                return;
            }
            if (!existing) {
                appendLiveRow();
                return;
            }

            existing.querySelector('.seq-swatch').style.background = ruleColor(live.rule);
            existing.querySelector('.seq-label').textContent = `${live.length} row${live.length === 1 ? '' : 's'}, playing`;
            const input = existing.querySelector('.seq-rule-input');
            if (document.activeElement !== input) input.value = live.rule;
        }

        function applyBandSequence() {
            pauseSimulation();

            for (const y of sequenceOverrideYs) ruleOverrides.delete(y);
            sequenceOverrideYs = [];

            let y = 0;
            for (const band of bandSequence) {
                ruleOverrides.set(y, band.rule);
                sequenceOverrideYs.push(y);
                y += band.length;
            }

            const bottomRow = y - 1;
            if (bottomRow > maxY) cascadeFrom(bottomRow); // extend history to cover the whole sequence
            cascadeFrom(0); // recompute top-to-bottom so the sequence (or its removal) takes hold

            renderBandSequence();
            updateRuleLegend();
            draw();
        }

        btnAddBand.addEventListener('click', () => {
            let r = parseInt(seqRuleInput.value);
            let len = parseInt(seqLengthInput.value);
            if (isNaN(r)) r = 0;
            r = Math.max(0, Math.min(255, r));
            if (isNaN(len) || len < 1) len = 1;
            seqRuleInput.value = r;
            seqLengthInput.value = len;

            bandSequence.push({ rule: r, length: len });
            applyBandSequence();
        });

        btnClearOverlay.addEventListener('click', () => {
            overlayPixels.clear();
            draw();
        });

        btnStep.addEventListener('click', () => {
            pauseSimulation();
            stepForward();
        });

        btnBack.addEventListener('click', () => {
            pauseSimulation();
            stepBackward();
        });

        btnReset.addEventListener('click', () => {
            pauseSimulation();
            init();
        });

        // Zooms/pans so the whole simulated grid (all rows, full width) fits on
        // screen, rather than just recentering at a fixed scale -- useful after
        // playing far enough that the content no longer fits at 1:1.
        function centerView() {
            const contentWidth = GRID_WIDTH * cellSize;
            const contentHeight = (maxY - minY + 1) * cellSize;
            const fitScale = Math.min(canvas.width / contentWidth, canvas.height / contentHeight);
            scale = Math.max(0.1, Math.min(5.0, fitScale * 0.9)); // 0.9 for a little breathing room

            offsetX = canvas.width / 2 - (GRID_WIDTH * cellSize * scale) / 2;
            const midY = (minY + maxY) / 2;
            offsetY = canvas.height / 2 - midY * cellSize * scale;
            draw();
        }
        btnCenter.addEventListener('click', centerView);

        btnPlay.addEventListener('click', () => {
            if (isPlaying) pauseSimulation();
            else startSimulation();
        });

        function startSimulation() {
            isPlaying = true;
            btnPlay.innerHTML = '⏸ Pause';
            btnPlay.classList.add('active');
            playInterval = setInterval(stepForward, 1000 / 15); 
        }

        function pauseSimulation() {
            isPlaying = false;
            btnPlay.innerHTML = '▶ Play';
            btnPlay.classList.remove('active');
            clearInterval(playInterval);
        }

        // --- Mouse Interaction Logic (Pan & Draw) ---

        let isPanning = false;
        let isDrawing = false;
        let lastMouseX = 0;
        let lastMouseY = 0;

        canvas.addEventListener('contextmenu', e => e.preventDefault());

        function handleDraw(e) {
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            
            const gridX = Math.floor((mouseX - offsetX) / (cellSize * scale));
            const gridY = Math.floor((mouseY - offsetY) / (cellSize * scale));

            if (gridX >= 0 && gridX < GRID_WIDTH) {
                const isErase = e.shiftKey;
                
                if (toolSelect.value === 'overlay') {
                    const key = `${gridX},${gridY}`;
                    if (isErase) overlayPixels.delete(key);
                    else overlayPixels.add(key);
                    draw();
                } 
                else if (toolSelect.value === 'affect') {
                    const val = isErase ? 0 : 1;

                    if (!historyMap.has(gridY)) {
                        historyMap.set(gridY, new Uint8Array(GRID_WIDTH));
                    }

                    if (historyMap.get(gridY)[gridX] !== val) {
                        historyMap.get(gridY)[gridX] = val;

                        // Row gridY is now a new timeline seed: resimulate everything below it.
                        cascadeFrom(gridY);
                        draw();
                    }
                }
            }
        }

        // A right-click is ambiguous until release: dragged, it's a pan; released in
        // place, it's a tap that opens the per-row rule popup instead.
        let rightClickStartX = 0;
        let rightClickStartY = 0;
        let rightClickMoved = false;
        const RIGHT_CLICK_DRAG_THRESHOLD = 4;

        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 2 || toolSelect.value === 'pan') {
                isPanning = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                canvas.classList.add('panning');
                if (e.button === 2) {
                    rightClickStartX = e.clientX;
                    rightClickStartY = e.clientY;
                    rightClickMoved = false;
                }
            } else if (e.button === 0) {
                isDrawing = true;
                handleDraw(e);
            }
        });

        window.addEventListener('mouseup', (e) => {
            if (e.button === 2 || (e.button === 0 && toolSelect.value === 'pan')) {
                isPanning = false;
                canvas.classList.remove('panning');
            }
            if (e.button === 0) {
                isDrawing = false;
            }
            if (e.button === 2 && !rightClickMoved) {
                const gridX = Math.floor((e.clientX - offsetX) / (cellSize * scale));
                const gridY = Math.floor((e.clientY - offsetY) / (cellSize * scale));
                if (gridX >= 0 && gridX < GRID_WIDTH) {
                    openRulePopup(e.clientX, e.clientY, gridY);
                }
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                const dx = e.clientX - lastMouseX;
                const dy = e.clientY - lastMouseY;
                offsetX += dx;
                offsetY += dy;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
                if (Math.hypot(e.clientX - rightClickStartX, e.clientY - rightClickStartY) > RIGHT_CLICK_DRAG_THRESHOLD) {
                    rightClickMoved = true;
                }
                draw();
            } else if (isDrawing) {
                handleDraw(e);
            }
        });

        // --- Per-Row Rule Popup ---

        let activeRulePopup = null;

        function closeRulePopup() {
            if (!activeRulePopup) return;
            activeRulePopup.cleanup();
            activeRulePopup.el.remove();
            activeRulePopup = null;
        }

        function openRulePopup(clientX, clientY, gridY) {
            closeRulePopup();

            const currentRuleAtRow = activeRuleMap.get(gridY) ?? rule;

            const popup = document.createElement('div');
            popup.id = 'row-rule-popup';
            popup.style.left = `${clientX}px`;
            popup.style.top = `${clientY}px`;
            popup.innerHTML = `
                <label>Rule for row ${gridY}:</label>
                <input type="number" min="0" max="255" value="${currentRuleAtRow}">
            `;
            document.body.appendChild(popup);

            const input = popup.querySelector('input');
            input.focus();
            input.select();

            function outsideClick(e) {
                if (!popup.contains(e.target)) finish(true);
            }

            let done = false;
            function finish(shouldApply) {
                if (done) return;
                done = true;
                document.removeEventListener('mousedown', outsideClick, true);
                popup.remove();
                if (activeRulePopup && activeRulePopup.el === popup) activeRulePopup = null;

                if (shouldApply) {
                    let v = parseInt(input.value);
                    if (!isNaN(v)) {
                        v = Math.max(0, Math.min(255, v));
                        ruleOverrides.set(gridY, v);
                        if (!historyMap.has(gridY)) {
                            historyMap.set(gridY, new Uint8Array(GRID_WIDTH));
                        }
                        // Row gridY is now seeded with its own rule: resimulate everything below it.
                        cascadeFrom(gridY);
                        draw();
                    }
                }
            }

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') finish(true);
                else if (e.key === 'Escape') finish(false);
            });
            input.addEventListener('blur', () => finish(true));

            activeRulePopup = { el: popup, cleanup: () => document.removeEventListener('mousedown', outsideClick, true) };
            setTimeout(() => document.addEventListener('mousedown', outsideClick, true), 0);
        }

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            
            const zoomSensitivity = 0.001;
            const delta = e.deltaY * zoomSensitivity;
            const zoomFactor = Math.exp(-delta);
            
            const mouseX = e.clientX;
            const mouseY = e.clientY;

            offsetX = mouseX - (mouseX - offsetX) * zoomFactor;
            offsetY = mouseY - (mouseY - offsetY) * zoomFactor;
            scale *= zoomFactor;

            if (scale < 0.1) scale = 0.1;
            if (scale > 5.0) scale = 5.0;

            draw();
        }, { passive: false });

        resizeCanvas();
        init();

    </script>
</body>
</html>
